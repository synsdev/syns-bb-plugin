<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<!-- tool.html: the canonical loader (bartsoj/syns-templates/loader.html) plus a scope from the URL. -->
<style>
:root { color-scheme: light dark; }
#loader-msg { font: 15px/22px system-ui, sans-serif; max-width: 560px; margin: 64px auto; padding: 0 24px; }
#loader-note { position: fixed; left: 16px; bottom: 16px; z-index: 2147483647; max-width: calc(100vw - 64px);
  font: 13px/18px system-ui, sans-serif; background: #323232; color: #fff; border-radius: 6px; padding: 10px 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.3); }
</style>
</head>
<body>
<div id="loader-msg">Loading…</div>
<script>
/*
 * Thread Page loader. The app lives in this session's Syns repository under .page/, not here.
 * This file reads .page/index.html and the local stylesheets and scripts it names, all at one
 * version, through the Syns bb plugin (syns.*); applies the styles, puts the body in place and
 * runs the scripts in document order. Anything else the app needs from .page/ it reads itself
 * through syns.*, because a relative URL here points at bb storage, not at the repository.
 * Nothing in this file knows what the app is: copy it as it is.
 */
(async function () {
  "use strict";
  const APP = ".page/";
  const tp = window.threadPage;
  const say = function (text) { document.getElementById("loader-msg").textContent = text; };
  const call = function (method, params) { return tp.invoke(method, params || {}); };
  // ADJUST to the Thread Pages scope API once it is fixed: the document's scope, a folder inside
  // the session's folder, which the host passes to the plugin with every capability call.
  const setScope = function (path) { return tp.setScope ? tp.setScope(path) : call("page.setScope", { path: path }); };
  // A reference is local unless it has a scheme (https:, data:), starts with // or is a #fragment.
  const local = function (ref) { return !!ref && !/^([a-z][a-z0-9+.-]*:|\/\/|#)/i.test(ref); };
  // A local reference → its repository path: "js/a.js" → ".page/js/a.js".
  const resolve = function (ref) {
    const out = [];
    (APP + ref.split(/[?#]/)[0]).split("/").forEach(function (s) { if (s === "..") out.pop(); else if (s && s !== ".") out.push(s); });
    return out.join("/");
  };
  // Whole files at one version: 64 a call, following what did not fit; too large ones in windows of lines.
  const read = async function (paths, version) {
    const out = {};
    for (let i = 0; i < paths.length; i += 64) {
      for (let ask = paths.slice(i, i + 64); ask.length;) {
        const r = await call("syns.readMany", { paths: ask, version: version });
        r.files.forEach(function (f) { out[f.path] = f; });
        ask = r.deferred || [];
      }
    }
    for (const p of paths) {
      if (!out[p] || out[p].error !== "too_large") continue;
      const lines = [];
      for (let at = 1, total = 1; at <= total; at += 5000) {
        const r = await call("syns.read", { path: p, version: version, offset: at, limit: 5000 });
        total = r.totalLines; lines.push(r.text);
      }
      out[p] = { path: p, text: lines.join("\n") };
    }
    return out;
  };

  if (!tp) { say("This is a bb Thread Page loader. It works only when bb serves it as a session's page."); return; }
  const ctx = await call("context.get");
  if (!ctx.capabilities.some(function (c) { return c.method === "syns.readMany"; })) {
    say("This page loads its app from the session's Syns repository, but the Syns bb plugin is not installed or not enabled on this bb. Enable the syns plugin, then reload.");
    return;
  }
  // ---- tool.html: the only lines that differ from the canonical loader (D43) ----
  // This document opens one placed template as tool.html#<folder>. It sets the folder as its scope,
  // so every syns.* call below answers for that folder alone, as if it were the repository, and the
  // app's own .page/ is read from it, its code unchanged.
  const folder = decodeURIComponent(location.hash.replace(/^#/, "")).replace(/\/+$/, "");
  if (!folder || /^\/|(^|\/)\.\.?(\/|$)|\\/.test(folder)) {
    say("Open a placed tool as tool.html#<its folder>, such as tool.html#clients/vela/q3-board.");
    return;
  }
  try { await setScope(folder); }
  catch (e) { say("This bb's Thread Pages cannot give a page a folder of its own yet: " + (e && e.message || e)); return; }
  window.addEventListener("hashchange", function () { location.reload(); });
  // ---- end of tool.html's own lines ----
  let version;
  try { version = (await call("syns.repo")).version; }
  catch (e) {
    say(e.reason === "no_repo" ? "This session's folder is not a Syns repository, so there is no app to load. Start the session in the repository's folder." : "Syns didn't answer: " + e.message);
    return;
  }
  const index = (await read([APP + "index.html"], version))[APP + "index.html"];
  if (!index || index.error) { say("This repository has no " + APP + "index.html, so there is no app to load."); return; }

  const doc = new DOMParser().parseFromString(index.text, "text/html");
  const styles = Array.from(doc.head.querySelectorAll('link[rel="stylesheet"][href], style'));
  const scripts = Array.from(doc.querySelectorAll("script"));
  const wanted = styles.map(function (el) { return el.getAttribute("href"); })
    .concat(scripts.map(function (el) { return el.getAttribute("src"); }))
    .filter(local).map(resolve);
  const files = await read(wanted, version);
  const missing = wanted.filter(function (p) { return !files[p] || files[p].error; });
  if (missing.length) { say("The app names files that are not in the repository at this version: " + missing.join(", ")); return; }

  document.title = doc.title || document.title;
  styles.forEach(function (el) {
    const href = el.getAttribute("href");
    const node = document.createElement(el.tagName === "LINK" && !local(href) ? "link" : "style");
    if (node.tagName === "LINK") { node.rel = "stylesheet"; node.href = href; }
    else node.textContent = el.tagName === "STYLE" ? el.textContent : files[resolve(href)].text;
    document.head.appendChild(node);
  });
  Array.from(doc.body.attributes).forEach(function (a) { document.body.setAttribute(a.name, a.value); });
  scripts.forEach(function (s) { s.remove(); });
  document.body.replaceChildren.apply(document.body, Array.from(doc.body.childNodes).map(function (n) { return document.importNode(n, true); }));

  // One after another, in document order, as the browser would have run them.
  for (const s of scripts) {
    const node = document.createElement("script");
    Array.from(s.attributes).forEach(function (a) { if (a.name !== "src") node.setAttribute(a.name, a.value); });
    const src = s.getAttribute("src");
    if (src && !local(src)) {
      node.src = src;
      await new Promise(function (done) { node.onload = node.onerror = done; document.body.appendChild(node); });
    } else {
      node.textContent = src ? files[resolve(src)].text + "\n//# sourceURL=" + resolve(src) : s.textContent;
      document.body.appendChild(node);
    }
  }

  // When .page/ changes in the repository, say so once. This copy keeps running the version it loaded.
  let seen = version;
  const stop = tp.watch("syns.repo", {}, async function (repo) {
    if (!repo || !repo.version || repo.version === seen) return;
    const d = await call("syns.diff", { from: seen, to: repo.version }).catch(function () { return null; });
    if (!d) return;
    seen = repo.version;
    if (!d.files.some(function (f) { return f.path.indexOf(APP) === 0; })) return;
    stop();
    const note = document.createElement("div");
    note.id = "loader-note";
    note.setAttribute("role", "status");
    note.textContent = "This app was updated — reload the page to use the new version.";
    document.body.appendChild(note);
  }, { intervalMs: 15000 });
})().catch(function (e) {
  const m = document.getElementById("loader-msg");
  if (m) m.textContent = "The app didn't load: " + (e && e.message || e);
  console.error(e);
});
</script>
</body>
</html>
